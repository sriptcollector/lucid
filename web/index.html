<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lucid" />
  <title>Lucid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="brand" id="brandHome">
      <span class="rx">L</span>
      <span class="wordmark">Lucid</span>
    </div>
    <div class="sub" id="subline">The daily brief</div>
    <div class="appbar-actions">
      <button class="iconbtn" id="searchBtn" data-nav="search" title="Search" aria-label="Search">&#8981;</button>
      <button class="iconbtn" id="settingsBtn" data-nav="settings" title="Settings" aria-label="Settings">&#9881;</button>
      <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Theme">&#9681;</button>
    </div>
  </header>

  <nav class="lucidbar" id="lucidbar" hidden aria-label="Lucid sections">
    <div class="lucidbar-in">
      <div class="segtoggle seg-lucid" role="tablist">
        <button data-seg="notes"  role="tab" aria-selected="true"><span class="seg-ic">&#9636;</span>Notes</button>
        <button data-seg="people" role="tab" aria-selected="false"><span class="seg-ic">&#9677;</span>People</button>
        <button data-seg="ideas"  role="tab" aria-selected="false"><span class="seg-ic">&#9670;</span>Ideas</button>
      </div>
    </div>
  </nav>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-tab="home" class="active"><span class="ic">&#8962;</span>Today</button>
    <button data-tab="crm"><span class="ic">&#9638;</span>CRM</button>
    <button data-tab="lucid"><span class="ic">&#9737;</span>Lucid</button>
    <button data-tab="review"><span class="ic">&#10003;</span>Review</button>
  </nav>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
